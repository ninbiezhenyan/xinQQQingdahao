[build]
  # 站点根目录就是仓库根目录（index.html 在此）
  publish = "."

[build.processing]
  skip_processing = true

# 静态资源长缓存（HTML 不缓存，保证更新即时生效）
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
